name: Test custom retry settings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get current commit SHA
        id: get-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record start time
        id: start-time
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: ${{ github.repository }}
          sha: ${{ steps.get-sha.outputs.sha }}
          status: "nonexistent-status-check"
          expected_state: "success"
          check-retry-count: "2"
          check-retry-interval: "1"

      - name: Assert action completed within reasonable time and handled retries
        env:
          OUTCOME: ${{ steps.action.outcome }}
          START: ${{ steps.start-time.outputs.start }}
        run: |
          echo "outcome: $OUTCOME"
          END=$(date +%s)
          ELAPSED=$((END - START))
          echo "elapsed seconds: $ELAPSED"
          # With 2 retries at 1 second interval, should complete well under 60 seconds
          if [ "$ELAPSED" -gt 60 ]; then
            echo "FAIL: action took too long ($ELAPSED seconds), retry settings may not be respected"
            exit 1
          fi
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully after retries (sentinel repo or no matching status)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
