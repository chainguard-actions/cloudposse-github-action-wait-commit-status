name: Test sentinel repo graceful failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get current commit SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The action uses the 'repository' input directly (not GITHUB_REPOSITORY),
      # but GITHUB_REPOSITORY is a sentinel that doesn't exist on GitHub.
      # The action will fail with a 404 API error and call process.exit(1).
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: ${{ github.repository }}
          sha: ${{ steps.sha.outputs.sha }}
          status: ci/test
          expected_state: success
          check-retry-count: "1"
          check-retry-interval: "1"

      - name: Assert action failed gracefully on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (sentinel repo is not resolvable)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (real repo resolved)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
