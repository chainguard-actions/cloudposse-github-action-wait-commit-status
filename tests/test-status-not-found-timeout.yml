name: Test status not found timeout
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Use a real public repo with a known SHA but a non-existent status name.
      # The action should exhaust retries and exit with code 1 (failure).
      # actions/checkout is a well-known public repo; we use a known commit SHA.
      # The status name "nonexistent-status-xyz-12345" will never match any real status.
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: actions/checkout
          sha: de0fac2e4500dabe0009e67214ff5f5447ce83dd
          status: nonexistent-status-xyz-12345
          expected_state: success
          check-retry-count: "1"
          check-retry-interval: "1"

      - name: Assert action failed due to status not found (timeout)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (status not found after retries)"
          else
            echo "FAIL: expected failure but got '$OUTCOME'"
            exit 1
          fi
