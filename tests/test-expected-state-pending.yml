name: Test expected state pending
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get current commit SHA
        id: get-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: ${{ github.repository }}
          sha: ${{ steps.get-sha.outputs.sha }}
          status: "ci"
          expected_state: "pending"
          check-retry-count: "1"
          check-retry-interval: "1"

      - name: Assert action ran with pending expected_state
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (found pending status)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or no matching status)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
