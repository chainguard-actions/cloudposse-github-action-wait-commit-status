name: Test wrong expected state causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Use a real public repo with a known SHA and look for a status that
      # doesn't exist in the 'error' state. The action should exhaust retries
      # and exit with code 1 (failure) since the status won't be found in
      # the 'error' state.
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: actions/checkout
          sha: de0fac2e4500dabe0009e67214ff5f5447ce83dd
          status: nonexistent-status-xyz-12345
          expected_state: error
          check-retry-count: "1"
          check-retry-interval: "1"

      - name: Assert action failed when expected state not reached
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (status not in expected state after retries)"
          else
            echo "FAIL: expected failure but got '$OUTCOME'"
            exit 1
          fi
